name: masar_al_lugha
description: "Masar Al-Lugha (مسار اللغة) - A fun language learning path app. Learn English, French, Urdu & German with smart flashcards, leveled lessons and gamification."
publish_to: "none"
version: 5.14.1+39

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ">=2.2.0 <6.0.0"
  flutter_tts: ">=4.0.0 <6.0.0"
  speech_to_text: ">=7.0.0 <8.0.0"
  # v5.12 (F2.5): the ONLY new runtime plugin of the learning-engine wave —
  # local daily practice reminders. No network, no accounts: notifications
  # are scheduled on-device and nothing leaves the phone. `timezone` is the
  # plugin's own scheduling dependency, declared because notifications.dart
  # imports its TZDateTime API directly.
  flutter_local_notifications: ">=17.0.0 <20.0.0"
  timezone: ">=0.9.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/data/

dependency_overrides:
  shared_preferences_android: 2.4.10
