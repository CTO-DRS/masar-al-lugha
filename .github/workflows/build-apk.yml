name: Build Masar Al-Lugha APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# v5.18 Phase-2 (Batch A): verification and publishing are now SEPARATE jobs
# with separate privilege scopes — the verify job runs every gate with
# read-only permissions, and only the release job (which depends on verify
# passing) holds `contents: write` for the GitHub Release step.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Validate course content (v4.0 gate)
        run: python3 scripts/validate_content.py

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (v4.0 gate)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --concurrency=1

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION+$BUILD"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      # v5.17 Phase-1 (security path): a release APK built without
      # key.properties falls back to the DEBUG certificate. That fallback is
      # fine for sideload testing but must never be silent — the summary and
      # the log now state it explicitly so nobody mistakes this APK for a
      # Play-Store-ready artifact.
      - name: Sign-check (no silent debug signing)
        run: |
          if [ -f android/key.properties ]; then
            echo "Release keystore detected — production signing in use."
          else
            echo "⚠️ **DEBUG-SIGNED BUILD** — no \`key.properties\` was provided to this run, so app-release.apk is signed with the DEBUG certificate. Sideload/testing only; NOT for Play Store distribution." >> $GITHUB_STEP_SUMMARY
            echo "DEBUG-SIGNED: no key.properties in this run — the APK uses the debug certificate (sideload/testing only, not for Play Store)."
          fi

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masar-al-lugha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/masar-al-lugha-v${{ steps.version.outputs.version }}.apk"

      # v5.18 Phase-2: version-neutral release notes (Phase-1 remainder #5 —
      # the body used to hard-code v4.x feature lists on every release).
      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: مسار اللغة v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 مسار اللغة — الإصدار v${{ steps.version.outputs.version }} (بناء ${{ steps.version.outputs.build }})

            ### 📦 التحميل
            حمّل التطبيق من المرفقات بالأسفل: **masar-al-lugha-v${{ steps.version.outputs.version }}.apk**

            ### ✅ جودة هذا الإصدار
            - اجتاز هذا البناء بوابات التحقق كاملة: تحقق المحتوى + التنسيق + التحليل الثابت + كل الاختبارات.
            - تفاصيل ما الجديد في كل إصدار موثقة في `docs/ROADMAP.md` داخل المستودع.

            ### 📥 التثبيت
            1. حمّل ملف APK
            2. فعّل "التثبيت من مصادر غير معروفة" في إعدادات جهازك
            3. ثبّت التطبيق واستمتع بالتعلّم!

            ---
            🔒 هذا البناء من الفرع `main` بعد نجاح مهمة التحقق المستقلة كاملة.
          files: release/masar-al-lugha-v${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
          overwrite_files: true
